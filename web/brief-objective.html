<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brief, objectives: LoomBench</title>
<link rel="stylesheet" href="web/app.css">
<style>
  /* The Brief only: one page. A head, three figures and the findings, sized to print on one sheet. */
  .page { max-width: 1080px; padding-bottom: 40px; }
  .brief-head { margin: 14px 0 0; }
  .kicker { margin: 0; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
  .kicker a { color: var(--ink-2); }
  .brief-head h1 { margin: 4px 0 8px; font-size: 27px; }
  /* Question, design and result: three paragraphs side by side. */
  .summary { display: grid; grid-template-columns: 0.8fr 1.9fr 1.1fr; gap: 20px; margin: 0 0 8px; }
  .summary p { margin: 0; font-size: 13px; line-height: 1.45; }
  .summary b { font-weight: 600; }
  .terms { display: flex; flex-wrap: wrap; gap: 1px 14px; margin: 0 0 6px; font-size: 12px; line-height: 1.4; color: var(--ink-2); }
  .terms b { color: var(--ink); font-weight: 600; }
  .said { columns: 3; column-gap: 24px; font-size: 11px; line-height: 1.36; color: var(--ink-2); }
  .said-item { display: block; break-inside: avoid; margin: 0 0 2px; }
  .said-item b { color: var(--ink); font-weight: 600; }
  section { margin: 9px 0 0; padding-top: 8px; border-top: 1px solid var(--hairline); }
  h2 { margin: 0 0 4px; font-size: 15.5px; }
  .fig { margin-right: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
  .cap { margin: 0 0 6px; font-size: 12.5px; line-height: 1.42; color: var(--ink-2); max-width: none; }
  .muted { color: var(--muted); }

  /* Figure 1: two rows of six pictures, side by side. */
  .strips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 32px; margin: 6px 0 0; }
  .strip { min-width: 0; }
  .strip h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .strip-of { font-weight: 400; color: var(--ink-2); }
  .rugs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .rug { display: block; color: var(--ink); text-decoration: none; min-width: 0; }
  .rug img { display: block; width: 100%; height: auto; border-radius: 4px; background: var(--hairline); }
  .strip-row { display: flex; gap: 2px; margin-top: 5px; }
  .sq { flex: 1 1 0; height: 8px; border-radius: 2px; box-sizing: border-box; }
  .sq.odd { height: 12px; margin-top: -2px; border: 2px solid var(--ink); }
  .rug-n { margin-top: 4px; font-size: 12px; font-weight: 600; line-height: 1.2; }
  .rug-who { font-size: 11px; line-height: 1.25; color: var(--ink-2); }

  /* Figures 2 and 3: small panels on one scale. */
  .panels { display: grid; gap: 10px 14px; margin: 8px 0 0; }
  .panels.n6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .panels.n5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .panels.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .panels.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 28px; }
  .panels.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panels.n1 { grid-template-columns: minmax(0, 320px); }

  /* Figure 3: a row a decision system, a column a measure, each cell an estimate on its column's scale. */
  .bm-wrap { margin: 4px 0 0; }
  .bm { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  .bm th { padding: 0 8px 4px 0; text-align: left; vertical-align: bottom; font-size: 11.5px; font-weight: 500; line-height: 1.3; color: var(--ink-2); border-bottom: 1px solid var(--hairline); }
  .bm td { padding: 4px 8px 4px 0; vertical-align: middle; white-space: nowrap; border-bottom: 1px solid var(--hairline); }
  .bm th:first-child, .bm td:first-child { width: 150px; }
  .bm-name { font-weight: 600; white-space: normal; }
  .bm-n { display: block; font-weight: 400; font-size: 11px; color: var(--ink-2); }
  .bm .est { display: inline-block; vertical-align: middle; width: 96px; height: auto; margin-right: 6px; }
  .bm-num { display: inline-block; min-width: 34px; }
  .bm-diff td { color: var(--ink-2); }
  .bm-diff td.strong { color: var(--ink); }
  .bm tr:last-child td { border-bottom: 0; }
  .panel { min-width: 0; }
  .panel-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .panel-sub { font-size: 11.5px; line-height: 1.35; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-sub.wrap { white-space: normal; min-height: 31px; }
  .panel-x { font-size: 11px; color: var(--ink-2); text-align: center; }
  .plot { display: block; width: 100%; height: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 2px 0 4px; font-size: 11.5px; color: var(--ink-2); }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .dv-key { width: 10px; height: 10px; border-radius: 3px; }
  .dv { margin: 10px 0 6px; }
  .dv-row { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
  .dv-name { flex: 0 0 34px; font-size: 11px; color: var(--ink-2); text-align: right; white-space: nowrap; }
  .dv-bar { flex: 1 1 auto; display: flex; gap: 2px; height: 17px; min-width: 0; }
  .part { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; border-radius: 3px; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .part-second { background: var(--ink); color: #fff; }
  .part-first { background: #b9b7ae; color: var(--ink); }
  .part-joint { background: repeating-linear-gradient(45deg, #e9e8e1 0 5px, #d3d1c7 5px 7px); color: var(--ink); }

  /* Findings, then limitations, flowing in three columns. */
  .flow { columns: 3; column-gap: 26px; }
  .findings { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.42; }
  .findings li { margin: 0 0 5px; break-inside: avoid; }
  .flow .cap { font-size: 12px; margin: 6px 0 4px; break-inside: avoid; }
  .flow .limits b { color: var(--ink); font-weight: 600; }
  .findings b { font-weight: 600; }
  code { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }

  @media screen and (max-width: 860px) {
    .strips, .summary { grid-template-columns: 1fr; }
    .flow, .said { columns: 1; }
    .panels.n6, .panels.n5, .panels.n4, .panels.n3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  /* One A4 sheet: the page is laid out at its full width and scaled to the paper. */
  @page { size: A4 portrait; margin: 7mm; }
  @media print {
    body { background: #fff; zoom: 0.6; }
    .page { width: 1080px; max-width: none; padding: 0; margin: 0 auto; }
    .topbar { padding-bottom: 6px; }
    .topbar nav { display: none; }
    .brief-head { margin-top: 8px; }
    section, .strip, .panel { break-inside: avoid; }
  }
</style>
</head>
<body data-brief="objective">
<main class="page">
  <p class="muted">Loading…</p>
</main>
<script type="module" src="web/brief.mjs"></script>
</body>
</html>
