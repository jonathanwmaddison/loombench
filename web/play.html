<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play: LoomBench</title>
<link rel="stylesheet" href="web/app.css">
<style>
  /* Play only: the five seat cards (one row from 1000px wide, stacked below) and the inside of a seat. */
  .seats { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); margin: 24px 0; }
  .seat { display: flex; flex-direction: column; gap: 14px; }
  .seat-head { display: flex; align-items: center; gap: 8px; }
  .seat-head h2 { margin: 0; font-size: 16px; }
  .seat-title { display: flex; flex-direction: column; gap: 4px; }
  .seat .part { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  @media (min-width: 1000px) {
    .seats { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    /* The three parts of every seat share the bench's row lines, so the selects line up from card to card. */
    .seat { display: grid; grid-template-rows: subgrid; grid-row: span 3; row-gap: 14px; }
  }
  .seat select { width: 100%; }
  .seat .note { display: flex; flex-direction: column; gap: 4px; }
  .controls { margin-top: 8px; }

  /* The switches: one row each, its name, its control, and what the current setting does. */
  .switches { margin: 24px 0 0; }
  .switches h2 { margin-bottom: 4px; }
  .switches > p { margin: 0 0 12px; max-width: 72ch; }
  .switch { display: grid; grid-template-columns: 160px 280px minmax(0, 1fr); gap: 6px 20px; align-items: center; padding: 12px 0; border-top: 1px solid var(--hairline); }
  .switch:last-child { padding-bottom: 0; }
  .switch-name { font-size: 14px; font-weight: 600; }
  .switch-control select { max-width: 100%; }
  .switch-note { max-width: 68ch; }
  .segmented { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg-btn { font-size: 14px; line-height: 1.2; padding: 8px 14px; min-height: 34px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
  .seg-btn + .seg-btn { border-left: 1px solid var(--axis); }
  .seg-btn[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 500; }
  .seg-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .seg-btn:focus-visible { outline-offset: -3px; }
  @media (max-width: 899px) {
    .switch { grid-template-columns: minmax(0, 1fr); }
  }

  /* A seat that decides nothing in a solo match. */
  .seat.placeholder { background: transparent; border-style: dashed; }
  .seat.placeholder .part { opacity: 0.45; }
  .seat .role:empty { display: none; }
</style>
</head>
<body>
<main class="page" id="page"><p class="small muted">Loading…</p></main>
<script type="module" src="web/play.mjs"></script>
</body>
</html>
