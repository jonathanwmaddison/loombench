<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One match</title>
  <link rel="stylesheet" href="web/app.css">
  <style>
    /* One match only: the two columns, the scoreboard rows, the persona box, the choices and the drawn bar. */
    /* The page is wider here: 1240px, with the pictures in a left column of 584px and the scoreboard at the right. */
    .page { max-width: 1240px; }
    .back { margin: 20px 0 0; font-size: 14px; }
    .match-grid { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; margin-top: 8px; }
    .match-grid > * { min-width: 0; }
    .match-right { margin-top: 28px; }
    .match-right h2 { margin-top: 36px; }
    @media (min-width: 1240px) {
      .match-grid { grid-template-columns: minmax(0, 584px) minmax(0, 1fr); gap: 24px; }
      .match-right { margin-top: 0; }
    }
    .time { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    .time input[type=range] { flex: 1; min-width: 0; }
    .time-label { margin: 6px 0 0; font-size: 14px; font-weight: 600; }

    /* The two pictures side by side: the woven output, then the ownership or adoption map with its two-way toggle. */
    .pair { display: grid; grid-template-columns: repeat(2, 280px); gap: 16px; justify-content: start; }
    .pic-col { min-width: 0; }
    .pic-head { display: flex; align-items: center; gap: 8px; min-height: 34px; margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
    .pic-head .btn { padding: 4px 10px; font-size: 13px; }
    .pic-head .btn[aria-pressed="true"] { border-color: var(--ink); }
    .pair canvas { display: block; width: 280px; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--hairline); }
    .pic-note { margin: 8px 0 0; }

    /* The bench strip: five equal cells in seating order, each with the starting design and the name. */
    .bench-strip { margin-top: 18px; }
    .bench-strip > .small { margin: 0 0 8px; }
    .bench-cells { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .bench-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
    .bench-cell .small { font-weight: 600; }

    /* The scoreboard: one card of rows, the same column template in the header and in each row. */
    .scoreboard { padding: 4px 0; overflow: hidden; }
    .score-head, .score-row {
      display: grid; align-items: center; column-gap: 8px; row-gap: 6px; padding: 12px 12px;
      grid-template-columns: 92px 80px 88px 68px 104px minmax(0, 1fr);
      grid-template-areas: "name person goal spark now score" "did did did did did did";
    }
    .score-head { padding: 12px 12px 4px; grid-template-areas: "name person goal spark now score"; }
    .score-row { cursor: pointer; font-size: 14px; }
    .score-row + .score-row { border-top: 1px solid var(--hairline); }
    .score-row:hover { background: rgba(42, 120, 214, 0.06); }
    .score-row.sel { background: rgba(42, 120, 214, 0.06); box-shadow: inset 3px 0 0 var(--told); }
    .c-name { grid-area: name; display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
    .c-person { grid-area: person; min-width: 0; }
    .c-goal { grid-area: goal; min-width: 0; }
    .c-spark { grid-area: spark; display: block; width: 68px; height: auto; }
    .c-now { grid-area: now; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .c-score { grid-area: score; justify-self: end; text-align: right; font-variant-numeric: tabular-nums; }
    .c-did { grid-area: did; margin: 0; padding-left: 18px; }

    .quiet-box { margin: 0 0 4px; padding: 10px 12px; border: 1px solid var(--hairline); border-radius: 8px;
      background: var(--page); font-size: 13px; color: var(--ink-2); }
    .condition-notes { margin: 0 0 16px; border-left: 3px solid var(--told); }
    .condition-notes p { margin: 0 0 4px; max-width: 90ch; }
    .condition-notes p:last-child { margin: 0; }
    .q-title { margin: 20px 0 2px; font-size: 14px; font-weight: 600; }
    .q-ask { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
    .drawn { font-size: 13px; font-weight: 600; color: var(--ink); }
    .peer-box p { margin: 0; }
    .peer-box p + p { margin-top: 6px; }
    .peer-box .said { color: var(--ink); }
    .peer-chip { margin-left: 6px; vertical-align: 1px; }
    /* app.css sets these under .bar, so the overrides repeat .bar to win. */
    .bar .peer-track { position: relative; overflow: visible; flex: 1 1 0; min-width: 0; }
    .bar .peer-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink-2); }
    .bar.peer-bar { grid-template-columns: minmax(0, 1fr); min-width: 0; }
    .bar.peer-bar .bar-row { min-width: 0; }
    .bar .peer-w { width: auto; white-space: nowrap; }
    .bar .peer-w + .drawn { margin-left: 4px; }
    .talk { margin-top: 12px; padding-top: 4px; border-top: 1px solid var(--hairline); }
    .talk .small { margin: 14px 0 0; color: var(--ink-2); }

    .events { margin: 0; padding-left: 20px; font-size: 14px; }
    .events li { margin: 4px 0; }
    .round-head { margin: 16px 0 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }

    @media (min-width: 1240px) {
      .match-left { position: sticky; top: 16px; align-self: start; }
    }
    @media (max-width: 759px) {
      .pair { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .pair canvas { width: 100%; }
      .pic-head { font-size: 12px; }
      .score-head { display: none; }
      .score-head, .score-row { grid-template-columns: auto auto minmax(0, 1fr); }
      .score-head, .score-row { grid-template-areas: "name person goal" "spark now score" "did did did"; }
      .score-row { row-gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="page"><p class="sub">Loading…</p></main>
  <script type="module" src="web/match.mjs"></script>
</body>
</html>
